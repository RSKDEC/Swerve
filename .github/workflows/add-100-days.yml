        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, base64, gzip, hashlib, json

          encoded = "".join(os.environ[key] for key in sorted(os.environ) if key.startswith("SWERVE_BUNDLE_"))
          raw = gzip.decompress(base64.b64decode(encoded))
          if hashlib.sha256(raw).hexdigest() != "8273a266083044c2b4d08077ec48b6914d8205c8ca28a1d0b927fe4c741a24a3":
              raise SystemExit("The update payload is incomplete. No files were changed.")
          update = json.loads(raw)
          plan = []
          for item in update["files"]:
              path = Path(item["path"])
              if path.is_absolute() or ".." in path.parts or path.parts[0] == ".github":
                  raise SystemExit("Unexpected update path. No files were changed.")
              content = item["text"].encode("utf-8")
              if hashlib.sha256(content).hexdigest() != item["after"]:
                  raise SystemExit("Update content validation failed. No files were changed.")
              current = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
              if current == item["after"]:
                  continue
              if current != item["before"]:
                  raise SystemExit(f"STOP: {path} has changed since this update was prepared. No files were changed.")
              plan.append((path, content))

          # Validate the entire update before writing; changed files are never silently overwritten.
          for path, content in plan:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
              print(f"Installed {path}")
          print(f"Installed {len(plan)} files: 100 days / 500 new prompts.")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate all content, scoring and production build
        run: npm run check
      - name: Save the 100-day update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The 100-day update is already installed."
          else
            git commit -m "Prepare 100 daily challenges with 500 new prompts"
            git push origin HEAD:main
          fi
