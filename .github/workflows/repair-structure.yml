name: Restore Swerve project folders

on:
  push:
    branches: [main]
    paths: [.github/workflows/repair-structure.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore folders safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil

          FILES = """
          ef62ef9389308a1899a936bb0c90b5743326ccde23ebfd3103c12d65593bee76 .env.example
          ae31f065797368e7d684c3a777cd987f561ad49f4318061510c1b578cd0321c3 .gitignore
          32dcd743a0ffca59a737c87abcfcc3f57a0cede5cedb6a8b1b68d32a3b6d4506 .prettierrc.json
          c7fef5c042a51953b0e0fea85bd757d149eb8a26dd1f47fcda5918a03d76ec88 README.md
          d06cbfeed816604a5235a588eafa344e7e4054c21d47487d14b7381c00f5ea76 docs/architecture.md
          b0c5f3027e8bd05718f26608a88640f316c9b450591f7a2dcd906220b7b19deb docs/backend-contract.md
