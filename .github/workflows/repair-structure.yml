          3925ec54e73389617791e5da200ac53f620422088050b134f0cd6c2b8d2c5f8e src/ui/home.ts
          7ba130fe4c63c5af8d17f10ec80ae3d033ee9d7813c7bb4ddda13bad4cab5921 src/ui/results.ts
          542b46c2da052e276bc206f54782d0d9d7312150e34fab81017a5f09fbee7347 src/ui/reveal.ts
          ed10bfc30293008e4d39381d60b1746381d0edb88947b5aaeab4d08729b2b2fc src/ui/round.ts
          af3f4c5dfaff94d91bddb05f3113e8f174f2e3557e5f078abd492047dbdbd137 src/ui/shared.ts
          08c2f34272518b14b4a5a6940ca99414df58c5d5acc69f5c76377d915e41935b tests/fixtures.ts
          3bef36c34c31cfd2458f0abc04cd55a3190517e85bdaacbd8b0c67e80430c320 tests/game.test.ts
          28dd6541a613e45169f85cb58b62508a89e3ce6d8f52c2c757b25b18beb70bb7 tests/http-client.test.ts
          430bf2acc226d3023b765ca7816291147349ed15db0d5257b5523e4c4ddf5081 tests/scoring.test.ts
          264f5fb9a63673d3e39145f651396a82da70a3973488db94dab9766b17761a68 tests/storage.test.ts
          d47f28dc96031aa20c5f913788f81e2f0349f28422df155a927be36aac5691b7 tsconfig.json
          d9bf33cc7ea0383e52cd3702052d385945e28ddfa6fc04e039a46abd15042e01 vite.config.ts
          """

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          moves = []
          for entry in FILES.strip().splitlines():
              expected, destination = entry.split(" ", 1)
              target = Path(destination)
              name = target.name
              source = Path("download" if destination == ".gitignore" else name.lstrip(".") if name.startswith(".") else name)
              if target.is_file():
                  if digest(target) != expected:
                      raise SystemExit(f"STOP: {target} has changed. No files were moved.")
                  continue
              if not source.is_file() or digest(source) != expected:
                  raise SystemExit(f"STOP: {source} is missing or changed. No files were moved.")
              moves.append((source, target))

          # Validate the whole plan before moving any files, and never overwrite an existing file.
          for source, target in moves:
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.move(str(source), str(target))
              print(f"Restored {source} -> {target}")
          print(f"Restored {len(moves)} paths. Original ci.yml/pages.yml remain as inactive templates.")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test and build before saving
        run: npm run check
      - name: Save repaired project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The project folders are already correct."
          else
            git commit -m "Restore Swerve project folder structure"
            git push origin HEAD:main
          fi
