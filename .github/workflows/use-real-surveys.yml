name: Install Swerve unique question bank
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/use-real-surveys.yml]
permissions:
  contents: write
concurrency:
  group: swerve-survey-install
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified questions and pinned public evidence
        env:
          SWERVE_BANK_BUNDLE_000: 
          SWERVE_BANK_BUNDLE_001: 
          SWERVE_BANK_BUNDLE_002: 
          SWERVE_BANK_BUNDLE_003: 
          SWERVE_BANK_BUNDLE_004: 
          SWERVE_BANK_BUNDLE_005: 
          SWERVE_BANK_BUNDLE_006: 
          SWERVE_BANK_BUNDLE_007: 
          SWERVE_BANK_BUNDLE_008: 
          SWERVE_BANK_BUNDLE_009: 
          SWERVE_BANK_BUNDLE_010: 
          SWERVE_BANK_BUNDLE_011: 
          SWERVE_BANK_BUNDLE_012: 
          SWERVE_BANK_BUNDLE_013: 
          SWERVE_BANK_BUNDLE_014: 
          SWERVE_BANK_BUNDLE_015: 
          SWERVE_BANK_BUNDLE_016: 
          SWERVE_BANK_BUNDLE_017: 
          SWERVE_BANK_BUNDLE_018: 
          SWERVE_BANK_BUNDLE_019: 
          SWERVE_BANK_BUNDLE_020: 
          SWERVE_BANK_BUNDLE_021: 
          SWERVE_BANK_BUNDLE_022: 
          SWERVE_BANK_BUNDLE_023: 
          SWERVE_BANK_BUNDLE_024: 
          SWERVE_BANK_BUNDLE_025: 
          SWERVE_BANK_BUNDLE_026: 
          SWERVE_BANK_BUNDLE_027: 
          SWERVE_BANK_BUNDLE_028: 
          SWERVE_BANK_BUNDLE_029: 
          SWERVE_BANK_BUNDLE_030: 
          SWERVE_BANK_BUNDLE_031: 
          SWERVE_BANK_BUNDLE_032: 
          SWERVE_BANK_BUNDLE_033: 
          SWERVE_BANK_BUNDLE_034: 
          SWERVE_BANK_BUNDLE_035: 
          SWERVE_BANK_BUNDLE_036: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, base64, hashlib, io, json, zipfile, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          payload = base64.b64decode("".join(os.environ[k] for k in sorted(os.environ) if k.startswith("SWERVE_BANK_BUNDLE_")), validate=True)
          if hashlib.sha256(payload).hexdigest() != "16bb22383acf7a0509bf72bbae2aae75e439c1534bedf109c5b948bd935310b3":
              raise SystemExit("Incomplete update payload. No files changed.")
          archive = zipfile.ZipFile(io.BytesIO(payload))
          manifest = json.loads(archive.read("SWERVE_UPDATE_MANIFEST.json"))
          plan = []
          for item in manifest["files"]:
              path = Path(item["path"])
              if path.is_absolute() or ".." in path.parts or path.parts[0] == ".github":
                  raise SystemExit("Unexpected path. No files changed.")
              current = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
              if current == item["after"]:
                  continue
              if current != item["before"]:
                  raise SystemExit(f"STOP: {path} changed after this update was prepared. No files changed.")
              plan.append(item)
          def materialize(item):
              if "url" in item:
                  if not item["url"].startswith("https://assets.publishing.service.gov.uk/"):
                      raise ValueError("Unexpected evidence host")
                  content = urllib.request.urlopen(item["url"], timeout=45).read()
              else:
                  content = archive.read(item["path"])
              if hashlib.sha256(content).hexdigest() != item["after"]:
                  raise ValueError("Source/file checksum mismatch: " + item["path"])
              return Path(item["path"]), content
          # Fetch and validate all source evidence BEFORE writing any project file.
          with ThreadPoolExecutor(max_workers=4) as pool:
              ready = list(pool.map(materialize, plan))
          for path, content in ready:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
              print("Installed", path)
          print(f"Installed {len(ready)} files: 310 verified questions, 62 days, zero repeats; 1515 more needed for a year.")
          PY
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Commit verified source-backed update
        run: |
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Expand verified question bank and forbid daily question reuse'
          git push origin HEAD:main
