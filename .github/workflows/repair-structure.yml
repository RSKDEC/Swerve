          732d02f96db327a61ed9811df6b1b3d55d169258b6c0884ebaee4518cd9e7313 docs/prototype-audit.md
          c5fb93955b5e07e0083ed24d760cc5c2a874a1b13901f7091bf03182ae0bd4a1 docs/screenshots/mobile-home.png
          df8d605f234c45143848ffa98064a138e4137ead9b86f98ca2e1d3e337dd8e78 docs/screenshots/small-mobile-round.png
